name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Checks
        working-directory: ui
        run: npm run check
      - name: Build
        working-directory: ui
        run: npm run build

  windows:
    name: Shell and launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # stage-payload.ps1 packs ui/dist into the launcher, so the editor has to be built here.
      - name: Build editor
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build shell
        run: dotnet build shell/MacroShell.csproj
      - name: Build launcher
        run: dotnet build launcher/Vendetta.csproj
      - name: Report lines
        run: dotnet run --project shell/report-board-test/ReportBoardTest.csproj -c Release

  engine-linux:
    name: Native engine core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S engine-native -B engine-native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build engine-native/build
      - name: Version
        run: test "$(engine-native/build/macroui-engine)" = "macroui-engine 0"
      - name: Clock
        run: engine-native/build/engine-clock-test
      - name: Hooks
        run: engine-native/build/engine-hook-test
      - name: Output
        run: engine-native/build/engine-output-test

  engine-windows:
    name: Native engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S engine-native -B engine-native/build -A x64
      - name: Build
        run: cmake --build engine-native/build --config Release
      - name: Version
        shell: pwsh
        run: |
          $line = (& "engine-native/build/macroui-engine.exe" | Out-String).Trim()
          if ($line -ne "macroui-engine 0") {
            Write-Error "version was [$line]"
            exit 1
          }
          & "engine-native/build/engine-clock-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "engine-native/build/engine-clock-wait-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "engine-native/build/engine-hook-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "engine-native/build/engine-hook-win-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "engine-native/build/engine-output-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "engine-native/build/engine-output-win-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
